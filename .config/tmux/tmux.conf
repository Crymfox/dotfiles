# ==========================================
# TMUX Configuration
# ==========================================

# Enable 256 color support
set -g default-terminal "tmux-256color"

# Enable true color (24-bit) support for modern terminals like WezTerm
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",wezterm:Tc"

# Enable RGB colour if running in xterm
set -sa terminal-overrides ",xterm*:Tc"

# ==========================================
# Mouse Support
# ==========================================

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# ==========================================
# Scrolling & History
# ==========================================

# Increase scrollback buffer size
set -g history-limit 50000

# ==========================================
# Visual & UI Improvements
# ==========================================

# Start window and pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Allow automatic renaming of windows
set -g automatic-rename on

# Set terminal title
set -g set-titles on
set -g set-titles-string '#T'

# Enable focus events for better integration
set -g focus-events on

# ==========================================
# Key Bindings
# ==========================================

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Better split commands (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ==========================================
# Performance & Responsiveness
# ==========================================

# Reduce escape time for faster command sequences
set -sg escape-time 10

# Increase display time for messages
set -g display-time 2000

# Refresh status bar more frequently
set -g status-interval 5

# ==========================================
# Status Bar Configuration
# ==========================================

# Position status bar at bottom
set -g status-position bottom

# Style the status bar
set -g status-style 'bg=colour234 fg=colour137'
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241] %d/%m #[fg=colour233,bg=colour245] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# Style the windows list
setw -g window-status-current-style 'fg=colour1 bg=colour238 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '
setw -g window-status-style 'fg=colour9 bg=colour236'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# ==========================================
# Pane Borders
# ==========================================

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour51'

