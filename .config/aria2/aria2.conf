# === General ===
dir=/home/crymfox/Downloads
continue=true
file-allocation=falloc
log-level=warn

# === BitTorrent ===
enable-dht=true
bt-enable-lpd=true
enable-peer-exchange=true
bt-seed-unverified=false
seed-ratio=1.0
seed-time=120

# === Performance ===
max-connection-per-server=4
split=4
min-split-size=5M

# === RPC (for Web UI/daemon) ===
enable-rpc=true
rpc-listen-all=true
rpc-allow-origin-all=true
rpc-listen-port=6800
# rpc-secret=your_secret_key  # Uncomment & set if you want auth
